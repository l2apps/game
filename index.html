<!DOCTYPE html>
<html lang="vi" class="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto-Arena Simulator</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>body{font-family:Inter,system-ui,sans-serif;background:#060913;color:#e2e8f0}
.toast{transition:all .35s;transform:translate(-50%,-18px);opacity:0;pointer-events:none}.toast.show{transform:translate(-50%,0);opacity:1}
select option:disabled{color:#475569}</style></head>
<body class="min-h-screen p-2 sm:p-4 select-none">
<nav class="max-w-[1500px] mx-auto flex flex-wrap items-center gap-2 mb-3">
 <h1 class="font-black mr-3">⚔️ Auto-Arena</h1>
 <button data-tab="teams" class="tab px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-800 border border-slate-700">👥 Đội</button>
 <button data-tab="tour" class="tab px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-800 border border-slate-700">🏆 Giải đấu</button>
 <button data-tab="match" class="tab px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-800 border border-slate-700">🏟️ Sân đấu</button>
 <span id="season-label" class="ml-auto text-xs font-bold text-amber-300"></span>
 <button id="btn-guide" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-sky-300 border border-slate-700">📖 Bách thư</button>
</nav>
<div class="max-w-[1500px] mx-auto">
<section id="view-teams" class="space-y-3">
 <div id="region-tabs" class="grid grid-cols-2 sm:grid-cols-4 gap-2"></div>
 <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-3 flex flex-wrap items-center gap-2 text-xs font-bold">
  <span>🔵</span><select id="sel-blue" class="bg-slate-950 border border-slate-700 rounded px-2 py-1.5 text-sky-300"></select><span class="text-slate-500">VS</span>
  <span>🔴</span><select id="sel-red" class="bg-slate-950 border border-slate-700 rounded px-2 py-1.5 text-rose-300"></select>
  <select id="sel-bo" class="bg-slate-950 border border-slate-700 rounded px-2 py-1.5"><option value="1">BO1</option><option value="3">BO3</option><option value="5">BO5</option><option value="7">BO7</option></select>
  <button id="btn-friendly" class="px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white">⚔️ Vào trận giao hữu</button>
  <button id="btn-add-team" class="ml-auto px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white">➕ Thêm đội vào khu vực</button>
 </div>
 <div id="teams-list" class="space-y-2"></div>
</section>
<section id="view-tour" class="hidden"><div class="bg-slate-900/90 border border-slate-800 rounded-xl p-6 text-center text-slate-400">🏆 Hệ thống giải đấu sẽ được hoàn thiện ở Đợt 2 (<code>tournament.js</code>).</div></section>
<section id="view-match" class="hidden space-y-3">
 <header class="bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-2 flex flex-wrap items-center justify-between gap-2">
  <div class="text-sm font-bold text-sky-400" id="blue-name">ĐỘI XANH</div>
  <div class="flex items-center gap-2 flex-wrap justify-center">
   <span id="series-info" class="text-[11px] text-slate-400"></span>
   <span id="match-timer" class="font-mono text-lg font-extrabold bg-slate-950 border border-slate-800 px-3 rounded-full">00:00</span>
   <button id="btn-play" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-600 text-white">⏸ Tạm dừng</button>
   <button id="btn-speed" class="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-amber-300 border border-slate-700">Tốc độ: <span id="speed-text">1x</span></button>
   <button id="btn-skip" class="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-emerald-300 border border-slate-700">⏩ Mô phỏng nhanh</button>
  </div>
  <div class="text-sm font-bold text-rose-400" id="red-name">ĐỘI ĐỎ</div>
 </header>
 <div class="grid grid-cols-1 lg:grid-cols-[210px_minmax(0,1fr)_210px] gap-3 items-start">
  <aside id="panel-blue" class="order-2 lg:order-1 space-y-2"></aside>
  <main class="order-1 lg:order-2 relative border border-slate-800 rounded-xl overflow-hidden bg-slate-950">
   <div id="kill-banner" class="toast absolute top-3 left-1/2 z-20 bg-slate-950/90 border border-slate-700 px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold whitespace-nowrap"></div>
   <div id="ace-banner" class="toast absolute top-14 left-1/2 z-20 px-5 py-2 rounded-xl border-2 text-xs sm:text-base font-black whitespace-nowrap"></div>
   <canvas id="arena-canvas" class="block w-full h-auto" style="max-height:calc(100vh - 110px)"></canvas>
  </main>
  <aside id="panel-red" class="order-3 space-y-2"></aside>
 </div>
</section></div>

<div id="guide-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/85 p-3"><div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-6xl w-full max-h-[90vh] flex flex-col overflow-hidden">
 <div class="flex justify-between px-5 py-3 border-b border-slate-800"><h2 class="font-black text-amber-300">📖 Bách Thư 30 Vai Trò</h2><button id="guide-close" class="px-3 py-1 rounded-lg text-xs bg-slate-800 border border-slate-700">✕ Đóng</button></div>
 <div id="guide-body" class="p-4 overflow-y-auto space-y-4"></div></div></div>

<div id="draft-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/85 p-3"><div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-4xl w-full max-h-[92vh] flex flex-col overflow-hidden">
 <div class="px-5 py-3 border-b border-slate-800"><h2 id="draft-title" class="font-black text-amber-300">Pick Tướng</h2><p id="draft-sub" class="text-[11px] text-slate-400"></p></div>
 <div id="draft-body" class="p-4 overflow-y-auto grid grid-cols-1 md:grid-cols-2 gap-4"></div>
 <div class="px-5 py-3 border-t border-slate-800 flex justify-end gap-2"><button id="draft-cancel" class="px-4 py-2 rounded-lg text-sm bg-slate-800 border border-slate-700">Hủy</button><button id="draft-ok" class="px-5 py-2 rounded-lg text-sm font-bold bg-emerald-600 text-white">✅ Bắt đầu ván</button></div></div></div>

<div id="victory-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/80 p-3"><div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-2xl w-full max-h-[92vh] overflow-y-auto p-5 space-y-3">
 <h2 id="v-title" class="text-2xl font-black text-center"></h2><div id="v-sub" class="text-center text-xs text-slate-300"></div>
 <div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><div class="bg-slate-950/70 border border-sky-900/60 rounded-xl p-3"><div class="text-xs font-bold text-sky-400 mb-2">🔵 Đội Xanh • KDA</div><div id="v-blue" class="space-y-1 text-xs"></div></div>
 <div class="bg-slate-950/70 border border-rose-900/60 rounded-xl p-3"><div class="text-xs font-bold text-rose-400 mb-2">🔴 Đội Đỏ • KDA</div><div id="v-red" class="space-y-1 text-xs"></div></div></div>
 <div class="flex justify-center gap-2"><button id="v-next" class="px-6 py-2.5 rounded-xl font-bold text-sm bg-emerald-600 text-white">⚔️ Ván tiếp theo</button><button id="v-teams" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-slate-800 border border-slate-700">👥 Danh sách đội</button></div></div></div>
<script type="module" src="main.js"></script>
</body></html>
